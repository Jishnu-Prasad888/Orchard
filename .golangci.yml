# golangci-lint configuration (v2).
#
# `default: standard` enables the classic default set: errcheck, govet,
# ineffassign, staticcheck, and unused. More linters can be enabled as the
# codebase grows; keep the set small and boring.
#
# web/node_modules contains third-party Go modules (e.g. npm packages that
# vendor Go code) which are unrelated to this Go module; exclude them from
# analysis and formatting so scans stay fast and hermetic.
version: "2"

linters:
  default: standard
  exclusions:
    paths:
      - web/node_modules

formatters:
  enable:
    - gofmt
  exclusions:
    paths:
      - web/node_modules