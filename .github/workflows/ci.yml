# CI: every push to main and every pull request runs the same checks as
# `make lint test` locally, then builds the real binary with the frontend
# embedded so a broken production build is caught before release.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (format, vet, lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./cmd/... ./internal/...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
      - name: Test (race detector)
        run: go test -race ./cmd/... ./internal/...

  web:
    name: Web (typecheck, lint, format, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  build:
    name: Build binary
    needs: [go, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build frontend
        working-directory: web
        run: npm ci && npm run build
      - name: Build Orchard with the frontend embedded
        run: |
          cp -r web/dist/. internal/webui/dist/
          CGO_ENABLED=0 go build -trimpath -o bin/orchard ./cmd/orchard
