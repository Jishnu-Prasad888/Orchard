# Release: pushing a version tag (v1.2.3) tests the tree, cross-compiles
# Orchard for every platform `make release` targets (frontend embedded), and
# attaches the binaries and their SHA256SUMS to a *draft* GitHub release.
# Nothing is published until someone reviews the draft and publishes it.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Test
        run: |
          go test ./cmd/... ./internal/...
          (cd web && npm test)
      - name: Build release binaries
        run: make release VERSION="${GITHUB_REF_NAME}"
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --draft --verify-tag \
              --title "Orchard $TAG" --generate-notes
          fi
